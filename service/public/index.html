<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全屋温湿度监控</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 登录 / 注册 -->
    <div v-if="!authed" class="login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <span class="login-logo">温</span>
          <span class="login-brand-text">全屋温湿度监控</span>
        </div>
        <div class="login-tabs">
          <button class="login-tab" :class="{ active: loginTab === 'login' }" @click="loginTab = 'login'">登录</button>
          <button class="login-tab" :class="{ active: loginTab === 'register' }" @click="loginTab = 'register'">注册</button>
        </div>
        <form v-if="loginTab === 'login'" @submit.prevent="login">
          <label class="login-label">用户名</label>
          <input class="login-input" v-model="loginForm.username" placeholder="请输入用户名" autocomplete="username">
          <label class="login-label">密码</label>
          <input class="login-input" v-model="loginForm.password" type="password" placeholder="请输入密码" autocomplete="current-password">
          <p v-if="authError" class="login-error">{{ authError }}</p>
          <button class="btn primary login-submit" type="submit" :disabled="authBusy">{{ authBusy ? '登录中…' : '登 录' }}</button>
        </form>
        <form v-else @submit.prevent="register">
          <label class="login-label">用户名</label>
          <input class="login-input" v-model="registerForm.username" placeholder="2-32 个字符，不含空格" autocomplete="username">
          <label class="login-label">密码</label>
          <input class="login-input" v-model="registerForm.password" type="password" placeholder="至少 6 位" autocomplete="new-password">
          <label class="login-label">确认密码</label>
          <input class="login-input" v-model="registerForm.confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
          <p v-if="authError" class="login-error">{{ authError }}</p>
          <button class="btn primary login-submit" type="submit" :disabled="authBusy">{{ authBusy ? '注册中…' : '注 册' }}</button>
        </form>
      </div>
    </div>

    <!-- 已登录主界面 -->
    <template v-else>
    <!-- 顶部 Tab -->
    <header class="tabbar">
      <button class="tab" :class="{ active: tab === 'main' }" @click="switchTab('main')">主页面</button>
      <button class="tab" :class="{ active: tab === 'subs' }" @click="switchTab('subs')">订阅页面</button>
      <button v-if="role === 'admin'" class="tab" :class="{ active: tab === 'users' }" @click="switchTab('users')">用户管理</button>
      <!-- 手机视图入口：独立只读展示页（手机 / 大屏查看用） -->
      <a class="tab mobile-link" href="/mobile.html" title="手机视图（只读展示）">📱 手机视图</a>
      <!-- 右上角用户区：头像（无头像时显示用户名首字）+ 用户名，点击弹出菜单 -->
      <div class="user-area" @click="toggleUserMenu">
        <span class="user-avatar">
          <img v-if="avatar" class="user-avatar-img" :src="avatar" alt="头像">
          <template v-else>{{ userAvatarText }}</template>
        </span>
        <span class="user-name">{{ username }}</span>
        <span class="user-caret">▾</span>
        <div v-show="userMenuOpen" class="user-menu" @click.stop>
          <button v-if="role === 'admin'" class="user-menu-item" @click="goAdminUsers">用户管理</button>
          <button class="user-menu-item" @click="openChangeAvatar">修改头像</button>
          <button class="user-menu-item" @click="openChangePwd">修改密码</button>
          <button class="user-menu-item danger" @click="logout">退出登录</button>
        </div>
      </div>
    </header>

    <!-- 主页面 -->
    <main v-show="tab === 'main'" class="main-page">
      <div class="main-stage" ref="stageBox">
        <!-- 主页面工具栏 -->
        <div class="stage-toolbar">
          <span class="stage-hint">{{ selectedPanel && selectedPanel.locked
            ? '右侧展开面板可为它添加节点小面板，数据到达自动刷新（🔒 当前面板已锁定，仅查看）'
            : '右侧展开面板可为它添加节点小面板；拖动小面板可调整位置，拖动四边可调整大小' }}</span>
        </div>

        <!-- 主页面缩放控制：底部中间，加减按钮 + 当前缩放百分比（100% = 窗口等比铺满的默认尺寸） -->
        <div class="stage-zoom">
          <button class="zoom-btn" title="缩小" @click="zoomOut" :disabled="zoomPct <= zoomMin">−</button>
          <span class="zoom-pct">{{ zoomPct }}%</span>
          <button class="zoom-btn" title="放大" @click="zoomIn" :disabled="zoomPct >= zoomMax">＋</button>
        </div>

        <!-- 主舞台滚动容器：舞台超出显示区域时在此内部滚动，不撑高/撑宽页面、不影响浏览器滚动条 -->
        <div class="stage-scroll">
        <!-- 主舞台：2560×1440 虚拟舞台等比缩放，小面板按坐标绝对定位（面板解锁时可拖动/缩放） -->
        <template v-if="selectedPanel">
          <div class="stage" :style="stageStyle">
            <div v-for="w in widgetsOfSelected" :key="w.id"
                 class="node-panel widget"
                 :class="{ stale: w.stale, editable: panelEditable, dblclickable: !panelEditable, dragging: dragState && dragState.id === w.id }"
                 :style="widgetStyle(w)"
                 :title="panelEditable ? '拖动调整位置，拖动四边调整大小' : '双击查看详情'"
                 @pointerdown="startWidgetDrag($event, w)"
                 @pointermove="onWidgetDrag($event, w)"
                 @pointerup="endWidgetDrag($event, w)"
                 @pointercancel="endWidgetDrag($event, w)"
                 @dblclick="onWidgetDblclick(w)">
              <div class="node-head">
                <span class="node-name">{{ widgetName(w) }}</span>
                <span class="head-right">
                  <span v-if="w.stale" class="stale-badge">离线</span>
                  <button v-if="panelEditable" class="widget-gear" title="图表设置"
                          @pointerdown.stop @click.stop="openWidgetSettings(w)">⚙</button>
                </span>
              </div>
              <template v-if="w.type === 'thermo'">
                <!-- 内容区：默认纵向（基础信息在上、曲线区在下）；水平布局改为横向一行（基础信息在左、曲线区在右） -->
                <div class="node-body" :class="{ 'layout-h': widgetChartLayout(w) === 'h' }">
                <div class="node-info">
                  <div class="node-temp">{{ fmtTemp(w.temperature) }}</div>
                  <div class="node-row">💧 湿度 {{ w.humidity != null ? w.humidity + ' %' : '--' }}</div>
                  <div class="node-row">🔋 电池 {{ batteryText(w) }}</div>
                  <div class="node-row sub" v-if="w.rssi != null">信号 {{ w.rssi }} dBm</div>
                </div>
                <!-- 曲线小图表：按布局排列（垂直堆叠 / 水平并排）；放不下就只显示前面几个，不挤压不滚动 -->
                <div class="node-charts" v-if="showCharts(w)">
                  <div v-for="key in chartsToShow(w)" :key="key" class="mini-chart">
                    <span class="mini-chart-title" :class="miniChartClass(key)">{{ miniChartLabel(key) }}</span>
                    <template v-if="hasSpark(w, key)">
                      <div class="spark-wrap">
                        <div class="spark-plot">
                          <!-- 网格线：先画垫在曲线下，与刻度一一对应，颜色淡一点（背景刻度网格） -->
                          <svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none">
                            <line v-for="xt in xTicksFor(w, key)" :key="'xv' + xt.x" class="spark-grid spark-grid-v"
                                  :x1="xt.x" y1="0" :x2="xt.x" y2="60" vector-effect="non-scaling-stroke"/>
                            <line v-for="yt in yTicksFor(w, key)" :key="'yh' + yt.v" class="spark-grid spark-grid-h"
                                  x1="0" :y1="yt.y" x2="100" :y2="yt.y" vector-effect="non-scaling-stroke"/>
                            <polyline :points="sparkPoints(w, key)"
                                      :class="['spark-line', miniChartClass(key)]" vector-effect="non-scaling-stroke"/>
                          </svg>
                          <!-- y 轴刻度值：≥3 个，叠在图区左侧，随网格线位置排布 -->
                          <span v-for="yt in yTicksFor(w, key)" :key="'yl' + yt.v" class="spark-ytick"
                                :style="yt.style">{{ yt.label }}</span>
                        </div>
                        <!-- x 轴时间刻度：1h/2h/3h 自适应，图区底部独立一行，随网格线位置排布 -->
                        <div class="spark-xaxis">
                          <span v-for="xt in xTicksFor(w, key)" :key="'xl' + xt.x" class="spark-xtick"
                                :style="xt.style">{{ xt.label }}</span>
                        </div>
                      </div>
                    </template>
                    <span v-else class="spark-empty">暂无数据</span>
                  </div>
                </div>
                </div>
              </template>
              <div v-else class="node-row sub">该类型待支持（{{ w.type }}）</div>
              <!-- 编辑态：四条边为拖拽缩放手柄（对边固定、被拖边跟随；四个角留空可拖动移动） -->
              <template v-if="panelEditable">
                <div class="resize-edge resize-edge-top" data-edge="top" title="拖动调整高度"></div>
                <div class="resize-edge resize-edge-bottom" data-edge="bottom" title="拖动调整高度"></div>
                <div class="resize-edge resize-edge-left" data-edge="left" title="拖动调整宽度"></div>
                <div class="resize-edge resize-edge-right" data-edge="right" title="拖动调整宽度"></div>
              </template>
            </div>
          </div>
          <div v-if="widgetsOfSelected.length === 0" class="widget-empty">
            「{{ selectedPanel.name }}」暂无节点小面板<br>
            <span class="sub">在右侧展开该面板 →「添加节点」</span>
          </div>
        </template>

          <div v-else class="empty-hint">
            <p>暂无面板</p>
            <p class="sub">点击右侧「＋ 添加面板」创建一个面板</p>
          </div>
        </div>
      </div>

      <!-- 右侧边栏（可收起/展开、宽度可拖动调节）：面板管理表（二级：面板 → 节点小面板） -->
      <aside class="side-rail"
             :class="{ collapsed: sideRailCollapsed, resizing: railResizing }"
             :style="sideRailCollapsed ? undefined : { width: sideRailWidth + 'px' }">
        <div v-if="!sideRailCollapsed" class="rail-resizer" title="拖动调整宽度"
             @pointerdown="startRailResize"></div>
        <button class="rail-toggle" @click="sideRailCollapsed = !sideRailCollapsed"
                :title="sideRailCollapsed ? '展开侧边栏' : '收起侧边栏'">
          {{ sideRailCollapsed ? '<<' : '>>' }}
        </button>
        <template v-if="!sideRailCollapsed">
          <button class="btn rail-btn add-panel-btn" @click="addPanel">＋ 添加面板</button>
          <div class="panel-list">
            <div v-if="panels.length === 0" class="panel-list-empty">暂无面板</div>
            <div v-for="panel in panels" :key="panel.id" class="panel-block">
              <div class="panel-item-row">
                <div class="panel-item" :class="{ active: panel.id === selectedPanelId }"
                     @click="onPanelRowClick(panel)" :title="panel.name">
                  <span class="panel-caret">{{ expandedPanelId === panel.id ? '▾' : '▸' }}</span>
                  <input v-if="renamingPanelId === panel.id" v-model="renameText"
                         class="panel-rename-input" placeholder="面板名" @click.stop
                         @keyup.enter="saveRename(panel)" @keyup.esc="cancelRename"
                         @blur="saveRename(panel)" />
                  <template v-else>
                    <span class="panel-item-name">{{ panel.name }}</span>
                  </template>
                  <span class="panel-widget-count">{{ widgetsOf(panel.id).length }}</span>
                </div>
                <button class="panel-icon-btn" :class="{ locked: panel.locked }"
                        @click="togglePanelLock(panel)"
                        :title="panel.locked ? '解锁面板' : '锁定面板'">{{ panel.locked ? '🔒' : '🔓' }}</button>
                <button class="panel-icon-btn" @click="startRename(panel)" title="重命名"
                        :disabled="panel.locked">✎</button>
                <button class="panel-icon-btn del" @click="removePanel(panel)" title="删除面板"
                        :disabled="panel.locked">✕</button>
              </div>
              <div v-show="expandedPanelId === panel.id" class="panel-detail">
                <div v-if="widgetsOf(panel.id).length === 0" class="widget-row-empty">暂无节点小面板</div>
                <div v-for="w in widgetsOf(panel.id)" :key="w.id" class="widget-row">
                  <span class="panel-dot" :class="{ off: w.stale }"></span>
                  <span class="widget-row-name" :title="w.topic">{{ widgetName(w) }}</span>
                  <span class="widget-row-temp">{{ fmtTemp(w.temperature) }}</span>
                  <button class="panel-icon-btn" title="图表设置" @click="openWidgetSettings(w)">⚙</button>
                  <button class="panel-icon-btn del" title="删除节点小面板" @click="removeWidget(w)"
                          :disabled="panel.locked">✕</button>
                </div>
                <select class="widget-add-select" v-model.number="newWidgetIndex" @change="onAddWidget(panel)"
                        :disabled="panel.locked || availableForPanel(panel.id).length === 0">
                  <option value="-1" disabled>＋ 添加节点…</option>
                  <option v-for="(n, i) in availableForPanel(panel.id)" :key="i" :value="i" :title="n.topic">
                    {{ (n.name || n.topic) }}（{{ n.topic }}）
                  </option>
                </select>
              </div>
            </div>
          </div>
        </template>
      </aside>
    </main>

    <!-- 订阅页面 -->
    <main v-show="tab === 'subs'" class="subs-page">
      <!-- 添加服务器（与各连接卡片同级别） -->
      <div class="mqtt-add-row">
        <button class="btn" @click="addMqttConn" :disabled="addingConn">
          {{ addingConn ? '添加中…' : '＋ 添加服务器' }}
        </button>
      </div>

      <!-- 平铺的 MQTT 连接卡片：每张 = 服务器配置 + 该连接上报的节点 -->
      <div class="mqtt-conns">
        <div v-if="mqttConns.length === 0" class="empty-hint subs-empty">
          <p>尚无 MQTT 连接</p>
          <p class="sub">点击上方「＋ 添加服务器」创建第一条连接</p>
        </div>
        <div v-for="conn in mqttConns" :key="conn.id" class="mqtt-conn-card">
          <!-- 头部：服务器名称 · 连接状态 · 主题数 -->
          <div class="mqtt-conn-head">
            <label class="check" :title="conn.enabled ? '已启用' : '已停用'">
              <input type="checkbox" v-model="conn.enabled" @change="toggleConnEnabled(conn)">
              <span class="checkmark"></span>
            </label>
            <input class="mqtt-conn-name" v-model="conn.name" placeholder="服务器名称">
            <span class="conn-badge" :class="conn.connected ? 'ok' : 'err'">
              {{ conn.connected ? '已连接' : '未连接' }}
            </span>
            <span class="conn-count">Topic数 {{ conn.topics.length }}</span>
            <span v-if="!conn.connected && conn.last_error" class="conn-err" :title="conn.last_error">
              {{ conn.last_error }}
            </span>
            <button class="btn btn-mini conn-cfg" @click="conn.showConfig = !conn.showConfig">
              配置 {{ conn.showConfig ? '▴' : '▾' }}
            </button>
            <button class="btn btn-mini conn-del" @click="removeMqttConn(conn)">删除</button>
          </div>

          <!-- 服务器配置（可折叠） -->
          <div v-show="conn.showConfig" class="conn-config">
            <div class="mqtt-grid">
              <div class="mqtt-field">
                <label>服务器地址</label>
                <input v-model="conn.host" placeholder="127.0.0.1">
              </div>
              <div class="mqtt-field">
                <label>端口</label>
                <input v-model.number="conn.port" type="number" min="1" max="65535">
              </div>
              <div class="mqtt-field">
                <label>用户名</label>
                <input v-model="conn.username" placeholder="可选，留空匿名">
              </div>
              <div class="mqtt-field mqtt-pwd-field">
                <label>密码</label>
                <div class="mqtt-pwd-row">
                  <input v-model="conn.password" type="password"
                         :placeholder="conn.password_set ? '已设置，留空保持不变' : '可选，留空匿名'">
                  <button class="btn primary save-conn" @click="saveMqttConn(conn)" :disabled="conn.saving">
                    {{ conn.saving ? '保存中…' : '保存并重连' }}
                  </button>
                </div>
              </div>
              <div class="mqtt-field mqtt-topics">
                <label>订阅主题（Topic）</label>
                <div class="topic-list">
                  <div v-if="conn.topics.length === 0" class="topic-empty">尚未添加主题，支持 +/# 通配符</div>
                  <div v-for="(t, i) in conn.topics" :key="i" class="topic-row">
                    <input class="topic-label" v-model="t.name" placeholder="节点名字" title="节点名字"
                           @change="applyTopics(conn)" @keyup.enter="applyTopics(conn)">
                    <select class="topic-type" v-model="t.type" title="主题类型" @change="applyTopics(conn)">
                      <option value="thermo">温湿度</option>
                      <option value="switch">开关（待支持）</option>
                    </select>
                    <input class="mono topic-name" v-model="t.topic" :title="t.topic"
                           placeholder="如 gateway_1/node_5/temperature"
                           @focus="t.__orig = t.topic" @change="editConnTopic(conn, t)" @keyup.enter="editConnTopic(conn, t)">
                    <!-- 主题后展示该主题最新上报节点的数据 / 状态 / 时间 -->
                    <span class="topic-latest" :title="t.latest ? '节点 ' + t.latest.name + ' · 最近上报 ' + t.latest.last_seen : '该主题尚未收到节点数据'">
                      <template v-if="t.latest">
                        <span class="tl-data">{{ fmtTemp(t.latest.temperature) }} / {{ t.latest.humidity != null ? t.latest.humidity + '%' : '--' }}</span>
                        <span class="tl-sep">·</span>
                        <span class="tl-status" :class="t.latest.stale ? 'off' : 'on'">{{ t.latest.stale ? '离线' : '在线' }}</span>
                        <span class="tl-sep">·</span>
                        <span class="tl-time">{{ fmtSeen(t.latest.last_seen) }}</span>
                      </template>
                      <span v-else class="tl-none">暂无数据</span>
                    </span>
                    <button class="topic-del" type="button" title="删除该主题" @click="removeConnTopic(conn, i)">✕</button>
                  </div>
                </div>
                <div class="topic-add">
                  <input v-model="conn.newTopicName" placeholder="节点名字">
                  <select class="topic-type" v-model="conn.newTopicType">
                    <option value="thermo">温湿度</option>
                    <option value="switch">开关（待支持）</option>
                  </select>
                  <input v-model="conn.newTopic" placeholder="如 gateway_1/node_5/temperature、+/+/temperature 或 #"
                         @keyup.enter="addConnTopic(conn)">
                  <button class="btn btn-mini" type="button" @click="addConnTopic(conn)" :disabled="!conn.newTopic.trim()">＋ 添加</button>
                </div>
              </div>
            </div>
            <div class="mqtt-actions" v-if="conn.password_set">
              <button class="btn" @click="clearMqttPassword(conn)">清除密码</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mqtt-tip">
        每个主题会显示其最新上报节点的数据 / 状态 / 时间；仅订阅主题列表内的节点会被监听，其余节点的数据不采集；
        主题的增删即时生效：在线连接直接增量订阅，无需重连；取消订阅的主题会从各面板移除对应节点小面板；
        服务器地址、端口、账号、密码、启停等连接级参数需点「保存并重连」；
        密码不回显，留空表示不修改；每个主题可配置节点名字与类型（当前仅温湿度，其余类型待支持）；
        主题支持 +/# 通配符，列表为空则不订阅任何主题。
        主页面节点小面板需手动添加：主页面右侧展开面板 →「添加节点」选择该主题。
      </div>
    </main>

    <!-- 用户管理页面（仅管理员） -->
    <main v-if="tab === 'users'" class="users-page">
      <div class="users-head">
        <span class="users-title">用户管理</span>
        <span class="users-sub">账号管理：可重置密码、删除用户；管理员无法查看其他用户的配置数据</span>
      </div>
      <div class="users-table">
        <div class="users-row users-head-row">
          <span class="u-col u-name">用户名</span>
          <span class="u-col u-role">角色</span>
          <span class="u-col u-time">注册时间</span>
          <span class="u-col u-actions">操作</span>
        </div>
        <div v-for="u in users" :key="u.id" class="users-row">
          <span class="u-col u-name" :title="u.username">{{ u.username }}</span>
          <span class="u-col u-role">
            <span class="role-badge" :class="{ admin: u.role === 'admin' }">{{ u.role === 'admin' ? '管理员' : '用户' }}</span>
          </span>
          <span class="u-col u-time">{{ fmtDate(u.created_at) }}</span>
          <span class="u-col u-actions">
            <button class="btn btn-mini" @click="resetUserPassword(u)">重置密码</button>
            <button class="btn btn-mini conn-del" :disabled="u.id === userId" :title="u.id === userId ? '不能删除自己' : '删除该用户（其全部数据一并删除）'"
                    @click="deleteUser(u)">删除</button>
          </span>
        </div>
      </div>
    </main>

    <!-- 节点小面板图表设置弹窗 -->
    <div v-if="widgetSettings" class="modal-mask" @click.self="closeWidgetSettings">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="modal-title">图表设置 — {{ widgetSettings.name }}</span>
          <button class="modal-close" title="关闭" @click="closeWidgetSettings">✕</button>
        </div>
        <div class="modal-body">
          <label class="modal-check">
            <input type="checkbox" v-model="widgetSettings.show_temp">
            <span>显示温度图表</span>
          </label>
          <label class="modal-check">
            <input type="checkbox" v-model="widgetSettings.show_hum">
            <span>显示湿度图表</span>
          </label>
          <label class="modal-check">
            <input type="checkbox" v-model="widgetSettings.show_bat">
            <span>显示电量图表</span>
          </label>
          <label class="modal-field">
            <span class="modal-field-label">曲线时间范围</span>
            <select class="modal-select" v-model="widgetSettings.chart_range">
              <option v-for="r in chartRanges" :key="r.key" :value="r.key">{{ r.label }}</option>
            </select>
          </label>
          <label class="modal-field">
            <span class="modal-field-label">图表布局</span>
            <select class="modal-select" v-model="widgetSettings.chart_layout">
              <option value="v">垂直布局</option>
              <option value="h">水平布局</option>
            </select>
          </label>
          <p class="modal-tip">勾选后该节点小面板显示对应曲线小图表；时间范围为曲线横轴显示多久的数据（默认近 1 天）。布局选「水平」时曲线横向排列，宽度不够自动隐藏后面的曲线。面板尺寸过小时自动隐藏全部图表，仅显示数据。</p>
        </div>
        <div class="modal-foot">
          <button class="btn" @click="closeWidgetSettings">取消</button>
          <button class="btn primary" @click="saveWidgetSettings" :disabled="widgetSettings.saving">
            {{ widgetSettings.saving ? '保存中…' : '保存' }}
          </button>
        </div>
      </div>
    </div>

    <!-- 修改密码弹窗：右上角用户下拉菜单进入；先校验旧密码，成功后提示结果 -->
    <div v-if="changePwdOpen" class="modal-mask">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="modal-title">修改密码</span>
          <button class="modal-close" title="关闭" @click="closeChangePwd">✕</button>
        </div>
        <div class="modal-body">
          <label class="login-label">旧密码</label>
          <input class="login-input" type="password" v-model="changePwdForm.oldPassword"
                 placeholder="请输入当前密码" autocomplete="current-password">
          <label class="login-label">新密码</label>
          <input class="login-input" type="password" v-model="changePwdForm.newPassword"
                 placeholder="请输入新密码（至少 6 位）" autocomplete="new-password">
          <p v-if="changePwdError" class="login-error">{{ changePwdError }}</p>
        </div>
        <div class="modal-foot">
          <button class="btn" @click="closeChangePwd">取消</button>
          <button class="btn primary" @click="saveChangePwd" :disabled="changePwdSaving">
            {{ changePwdSaving ? '提交中…' : '确认修改' }}
          </button>
        </div>
      </div>
    </div>

    <!-- 修改头像弹窗：右上角用户下拉菜单进入；选择图片即时预览，确认后上传 -->
    <div v-if="changeAvatarOpen" class="modal-mask">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span class="modal-title">修改头像</span>
          <button class="modal-close" title="关闭" @click="closeChangeAvatar">✕</button>
        </div>
        <div class="modal-body">
          <div class="avatar-preview-wrap">
            <div class="avatar-preview">
              <img v-if="avatarPreview" :src="avatarPreview" alt="头像预览">
              <span v-else>未选择图片</span>
            </div>
          </div>
          <label class="login-label">选择头像图片</label>
          <input class="login-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" @change="onAvatarFileChange">
          <p class="login-hint">支持 PNG / JPG / GIF / WebP，大小不超过 2MB</p>
          <p v-if="changeAvatarError" class="login-error">{{ changeAvatarError }}</p>
        </div>
        <div class="modal-foot">
          <button class="btn" @click="closeChangeAvatar">取消</button>
          <button class="btn primary" @click="saveChangeAvatar" :disabled="changeAvatarSaving">
            {{ changeAvatarSaving ? '上传中…' : '确认修改' }}
          </button>
        </div>
      </div>
    </div>

    <!-- 节点小面板详情大弹窗：双击锁定面板的节点小面板打开；点击弹窗外空白处自动关闭 -->
    <div v-if="detailWidget" class="detail-mask" @click.self="closeWidgetDetail">
      <div class="detail-modal" role="dialog" aria-modal="true">
        <div class="detail-head">
          <div class="detail-title">
            <span class="detail-name">{{ widgetName(detailWidget) }}</span>
            <span v-if="detailWidget.stale" class="stale-badge">离线</span>
            <span class="detail-topic" :title="detailWidget.topic">{{ detailWidget.topic }}</span>
            <select class="detail-range" v-model="detailRange" @change="onDetailRangeChange" title="曲线时间范围">
              <option v-for="r in chartRanges" :key="r.key" :value="r.key">{{ r.label }}</option>
            </select>
          </div>
          <button class="modal-close" title="关闭" @click="closeWidgetDetail">✕</button>
        </div>
        <!-- 当前温湿度 + 电量 -->
        <div class="detail-stats">
          <div class="detail-stat">
            <span class="detail-stat-label">温度</span>
            <span class="detail-stat-value temp">{{ fmtTemp(detailWidget.temperature) }}</span>
          </div>
          <div class="detail-stat">
            <span class="detail-stat-label">湿度</span>
            <span class="detail-stat-value hum">{{ detailWidget.humidity != null ? detailWidget.humidity + ' %' : '--' }}</span>
          </div>
          <div class="detail-stat">
            <span class="detail-stat-label">电量</span>
            <span class="detail-stat-value bat">{{ batteryText(detailWidget) }}</span>
          </div>
        </div>
        <!-- 温度 / 湿度 / 电量 三条曲线，垂直布局 -->
        <div class="detail-charts">
          <div v-for="key in detailChartKeys" :key="key" class="detail-chart">
            <div class="detail-chart-head">
              <span class="mini-chart-title" :class="miniChartClass(key)">{{ miniChartLabel(key) }}</span>
            </div>
            <template v-if="hasSpark(detailWidget, key)">
              <div class="spark-wrap">
                <div class="spark-plot" @mousemove="onDetailChartMove($event, key)" @mouseleave="onDetailChartLeave">
                  <svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none">
                    <line v-for="xt in xTicksFor(detailWidget, key)" :key="'dxv' + xt.x" class="spark-grid spark-grid-v"
                          :x1="xt.x" y1="0" :x2="xt.x" y2="60" vector-effect="non-scaling-stroke"/>
                    <line v-for="yt in yTicksFor(detailWidget, key)" :key="'dyh' + yt.v" class="spark-grid spark-grid-h"
                          x1="0" :y1="yt.y" x2="100" :y2="yt.y" vector-effect="non-scaling-stroke"/>
                    <polyline :points="sparkPoints(detailWidget, key)"
                              :class="['spark-line', miniChartClass(key)]" vector-effect="non-scaling-stroke"/>
                    <!-- 十字线：竖线/横线随鼠标位置移动 -->
                    <template v-if="detailHover && detailHover.key === key">
                      <line class="crosshair-line crosshair-v" :x1="detailHover.x" y1="0" :x2="detailHover.x" y2="60"/>
                      <line class="crosshair-line crosshair-h" x1="0" :y1="detailHover.y" x2="100" :y2="detailHover.y"/>
                    </template>
                  </svg>
                  <span v-for="yt in yTicksFor(detailWidget, key)" :key="'dyl' + yt.v" class="spark-ytick detail-ytick"
                        :style="yt.style">{{ yt.label }}</span>
                  <!-- 十字线：交点圆点 + y 轴数值标签 -->
                  <template v-if="detailHover && detailHover.key === key">
                    <span class="crosshair-dot" :style="crosshairDotStyle(detailHover)"></span>
                    <span class="crosshair-ylabel" :style="crosshairYStyle(detailHover)">{{ yValueAt(detailHover, key) }}</span>
                  </template>
                </div>
                <div class="spark-xaxis">
                  <span v-for="xt in xTicksFor(detailWidget, key)" :key="'dxl' + xt.x" class="spark-xtick detail-xtick"
                        :style="xt.style">{{ xt.label }}</span>
                  <!-- x 轴时间标签：鼠标 x 对应的时间 -->
                  <template v-if="detailHover && detailHover.key === key && timeAtX(detailHover) != null">
                    <span class="crosshair-xlabel" :style="crosshairXStyle(detailHover)">{{ timeAtX(detailHover) }}</span>
                  </template>
                </div>
              </div>
            </template>
            <div v-else class="spark-empty">暂无数据</div>
          </div>
        </div>
      </div>
    </div>
    </template>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="app.js"></script>
</body>
</html>
