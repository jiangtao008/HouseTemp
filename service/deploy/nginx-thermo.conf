# 全屋温湿度监控服务端 Nginx 反向代理模板
#
# 用法：
#   1. 把下面 server_name 换成你的域名
#   2. sudo cp nginx-thermo.conf /etc/nginx/sites-available/thermo
#   3. sudo ln -sf /etc/nginx/sites-available/thermo /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. DNS 解析生效后：sudo certbot --nginx -d 你的域名

server {
    listen 80;
    listen [::]:80;
    server_name thermo.example.com;   # ← 改成你的域名（如 thermo.you.com）

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
