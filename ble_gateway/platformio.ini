[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
build_flags =
  -std=gnu++17
  -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  h2zero/NimBLE-Arduino
  bblanchon/ArduinoJson
  knolleary/PubSubClient
  lvgl/lvgl@^8.3
